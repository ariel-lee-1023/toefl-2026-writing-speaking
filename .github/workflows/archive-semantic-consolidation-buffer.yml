name: Archive incoming semantic-consolidation-buffer notes

# Watches semantic-consolidation-buffer/incoming/ for newly uploaded
# .txt/.md files. Whenever one lands on `main`, this reformats it into the
# fixed Active Cognitive Buffer template, writes it into
# semantic-consolidation-buffer/content/ with the next sequential number,
# deletes the original incoming file, and commits the result back to the
# repo — fully automatic, no manual steps.
#
# No AI/external API calls and no domain/language classification: the host
# AI already produced the structured note upstream. This workflow only
# detects labeled sections, reformats, and archives what's already there.

on:
  push:
    branches: [main]
    paths:
      - "semantic-consolidation-buffer/incoming/**/*.txt"
      - "semantic-consolidation-buffer/incoming/**/*.md"

permissions:
  contents: write

concurrency:
  group: archive-semantic-consolidation-buffer
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # Avoid infinite loops: skip commits made by this workflow itself.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run archive script
        run: node .github/scripts/archive-semantic-consolidation-buffer.js

      - name: Commit and push archived files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add semantic-consolidation-buffer/incoming/ semantic-consolidation-buffer/content/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-archive incoming semantic-consolidation-buffer note(s) [skip ci]"
            git push
          fi
